<section class="container py-5" *ngIf="livro as item">
  <div class="product-navigation">
  <a routerLink="/" class="btn btn-outline-dark">
    <i class="bi bi-arrow-left"></i>
    Voltar para a loja
  </a>
</div>

  <div class="row g-5 align-items-start mt-2">
    <div class="col-md-5">
      <div class="product-cover"
        [style.view-transition-name]="'livro-' + item.id"
      >
        <img [src]="item.capa" [alt]="'Capa de ' + item.titulo">
      </div>
    </div>

    <div class="col-md-7">
      <div class="product-info">
        <small class="category">
          {{item.categorias.join(' • ')}}
        </small>

        <h1>{{item.titulo}}</h1>

        <p class="author">
          {{item.autor}}
        </p>

        <div class="price">
          {{item.preco | currency:'BRL'}}
        </div>

        <button
          class="btn btn-dark add-to-cart"
          (click)="adicionarAoCarrinho(item)"
        >
          <span *ngIf="!adicionadoAoCarrinho">
            Adicionar no carrinho
          </span>

          <span *ngIf="adicionadoAoCarrinho">
            Adicionado ao carrinho
          </span>
        </button>
      </div>
    </div>

    <div class="description-section">
      <h2>Sobre o livro</h2>
      <p class="description">
        {{item.descricao}}
      </p>
    </div>



    <div class="product-footer">
    <a routerLink="/" class="btn btn-outline-dark">
      <i class="bi bi-arrow-left"></i>
      Voltar para a loja

    </a>

</div>

  </div>
</section>

<section class="container py-5" *ngIf="!livro">
  <h1>Livro não encontrado</h1>
  <a routerLink="/" class="btn btn-dark">Voltar para a loja</a>

</section>
