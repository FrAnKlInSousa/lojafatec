<section class="auth-page">
  <div class="auth-card">
    <span class="eyebrow">Recuperação de acesso</span>

    <h1>Esqueci minha senha</h1>
    <p>Informe seu email para envio de link de redefinição de senha.</p>

    <form action="">
      <label for="" class="form-label">Email</label>
      <input type="email" [(ngModel)]="email" name="email" class="form-control mb-3">

      <button class="btn btn-dark w-100">Enviar link</button>
    </form>

    <a routerLink="/login" class="d-block mt-4">Voltar para o login</a>
  </div>
</section>
