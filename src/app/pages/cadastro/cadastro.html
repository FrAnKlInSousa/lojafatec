<section class="auth-page">
  <div class="auth-card">

    <div class="auth-header">
      <span class="eyebrow">Nova conta</span>
      <h1>Cadastrar</h1>
      <p>Crie sua conta para começar a comprar.</p>
    </div>

    <form (ngSubmit)="cadastrar()">

      <div
        class="alert alert-danger"
        *ngIf="erro"
      >
        {{erro}}
      </div>

      <div class="mb-3">
        <label for="nome" class="form-label">
          Nome
        </label>

        <input
          id="nome"
          type="text"
          class="form-control"
          [(ngModel)]="nome"
          name="nome"
        >
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">
          E-mail
        </label>

        <input
          id="email"
          type="email"
          class="form-control"
          [(ngModel)]="email"
          name="email"
          required
        >
      </div>

      <div class="mb-3">
        <label for="senha" class="form-label">
          Senha
        </label>

        <input
          id="senha"
          type="password"
          class="form-control"
          [(ngModel)]="senha"
          name="senha"
        >
      </div>

      <button
        class="btn btn-dark w-100"
        type="submit"
      >
        Criar conta
      </button>

    </form>

    <div class="auth-footer">
      <span>Já possui cadastro?</span>
      <a routerLink="/login">
        Entrar
      </a>
    </div>

  </div>
</section>
